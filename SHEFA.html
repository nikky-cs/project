<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHEFA – Emergency Detection System</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --red:      #ff1a2e;
      --red-dim:  #7a0010;
      --red-glow: rgba(255,26,46,0.35);
      --amber:    #ffaa00;
      --green:    #00ff88;
      --bg:       #080a0f;
      --panel:    rgba(13,17,23,0.95);
      --border:   rgba(255,26,46,0.22);
      --text:     #e8eaf0;
      --muted:    #5a6278;
      --font-head: 'Orbitron', monospace;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 17px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,26,46,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,26,46,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(255,26,46,0.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    /* ══════════════════
       HEADER
    ══════════════════ */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,10,15,0.92);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 16px; }

    .logo-hex {
      width: 48px; height: 48px;
      background: var(--red);
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 24px var(--red-glow);
      animation: hexpulse 2.2s ease-in-out infinite;
    }
    @keyframes hexpulse {
      0%,100% { box-shadow: 0 0 18px var(--red-glow); }
      50%      { box-shadow: 0 0 40px rgba(255,26,46,0.65); }
    }

    /* HEADLINE — italic */
    .logo-title {
      font-family: var(--font-head);
      font-style: italic;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #fff;
      text-shadow: 0 0 20px var(--red-glow);
    }
    .logo-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2.5px;
      margin-top: 3px;
    }

    .online {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 13px; color: var(--green);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ══════════════════
       STEPS NAV
    ══════════════════ */
    .steps-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 0; padding: 32px 24px 0;
    }
    .step-node {
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      min-width: 110px;
    }
    .step-circle {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 15px; color: var(--muted);
      transition: all 0.35s;
    }
    .step-circle.active { border-color: var(--red); color: var(--red); box-shadow: 0 0 16px var(--red-glow); }
    .step-circle.done   { border-color: var(--green); background: rgba(0,255,136,0.12); color: var(--green); }

    /* step labels — italic headline */
    .step-label {
      font-family: var(--font-head);
      font-style: italic;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-align: center;
    }
    .step-label.active { color: var(--red); }
    .step-label.done   { color: var(--green); }

    .step-line { flex: 1; height: 1px; background: var(--border); min-width: 40px; margin-bottom: 26px; }
    .step-line.done { background: var(--green); }

    /* ══════════════════
       MAIN
    ══════════════════ */
    .main { max-width: 840px; margin: 0 auto; padding: 40px 24px 90px; }

    /* WARN BANNER */
    .warn {
      background: rgba(255,170,0,0.06); border: 1px solid rgba(255,170,0,0.28);
      border-radius: 3px; padding: 14px 20px;
      font-family: var(--font-mono); font-size: 13px;
      color: var(--amber); letter-spacing: 1px; line-height: 1.7; margin-bottom: 20px;
    }

    /* ══════════════════
       CARD
    ══════════════════ */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      margin-bottom: 20px;
      position: relative;
      animation: fadeup 0.4s ease both;
    }
    @keyframes fadeup { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }

    /* CARD HEADING — italic */
    .card-head {
      font-family: var(--font-head);
      font-style: italic;
      font-size: 14px;
      letter-spacing: 3.5px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 12px;
    }
    .card-head::after { content: ''; flex:1; height:1px; background: var(--border); }

    /* ══════════════════
       GPS
    ══════════════════ */
    .gps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .gps-field {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,26,46,0.14);
      border-radius: 3px; padding: 13px 17px;
    }
    .gps-lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 2.5px; margin-bottom: 5px; }
    .gps-val { font-family: var(--font-mono); font-size: 17px; color: var(--green); }

    .desc-txt {
      font-family: var(--font-mono); font-size: 13px;
      color: var(--muted); margin-bottom: 18px;
      letter-spacing: 1px; line-height: 1.8;
    }

    /* ══════════════════
       BUTTONS
    ══════════════════ */
    .btn-primary {
      background: transparent; border: 1px solid var(--red); color: var(--red);
      font-family: var(--font-head); font-style: italic;
      font-size: 13px; letter-spacing: 3px;
      padding: 13px 30px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .btn-primary:hover:not(:disabled) { background: var(--red); color: #fff; box-shadow: 0 0 22px var(--red-glow); }
    .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }

    .btn-yes {
      background: transparent; border: 2px solid var(--red); color: var(--red);
      font-family: var(--font-head); font-style: italic;
      font-size: 13px; letter-spacing: 2.5px;
      padding: 13px 26px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .btn-yes.sel, .btn-yes:hover { background: var(--red); color: #fff; box-shadow: 0 0 20px var(--red-glow); }

    .btn-no {
      background: transparent; border: 2px solid var(--muted); color: var(--muted);
      font-family: var(--font-head); font-style: italic;
      font-size: 13px; letter-spacing: 2.5px;
      padding: 13px 26px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .btn-no.sel, .btn-no:hover { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.08); }

    .btn-big {
      width: 100%; padding: 20px;
      background: var(--red); border: none; color: #fff;
      font-family: var(--font-head); font-style: italic;
      font-size: 15px; letter-spacing: 5px;
      cursor: pointer; transition: all 0.22s; text-transform: uppercase;
      clip-path: polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
      position: relative; overflow: hidden;
    }
    .btn-big:hover:not(:disabled) { background: #ff3347; box-shadow: 0 0 40px rgba(255,26,46,0.5); }
    .btn-big:disabled { background: var(--red-dim); cursor: not-allowed; }
    .btn-big .sweep {
      position:absolute; top:-100%; left:0; right:0; height:100%;
      background:linear-gradient(transparent,rgba(255,255,255,0.1),transparent);
      animation:sweep 1.6s linear infinite;
    }
    @keyframes sweep { 0%{top:-100%} 100%{top:200%} }

    .btn-ghost {
      background: transparent; border: 1px solid var(--muted); color: var(--muted);
      font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px;
      padding: 9px 20px; cursor: pointer; transition: all 0.2s; margin-top: 16px;
    }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }

    /* ══════════════════
       UPLOAD
    ══════════════════ */
    .upload-zone {
      border: 2px dashed rgba(255,26,46,0.28);
      border-radius: 4px; padding: 44px 24px; text-align: center;
      cursor: pointer; transition: all 0.25s;
    }
    .upload-zone:hover, .upload-zone.over {
      border-color: var(--red); background: rgba(255,26,46,0.04);
    }
    .upload-icon { font-size: 40px; margin-bottom: 14px; }

    /* upload headline — italic */
    .upload-text {
      font-family: var(--font-head); font-style: italic;
      font-size: 15px; color: var(--muted); letter-spacing: 2px;
    }
    .upload-hint {
      font-family: var(--font-mono); font-size: 12px;
      color: rgba(90,98,120,0.55); margin-top: 7px; letter-spacing: 1.5px;
    }
    .preview {
      max-width: 100%; max-height: 280px; border-radius: 3px;
      border: 1px solid var(--border); object-fit: contain; display:block; margin: 0 auto;
    }

    /* ══════════════════
       TAGS
    ══════════════════ */
    .tag {
      display: inline-block; font-family: var(--font-mono);
      font-size: 11px; letter-spacing: 2px; padding: 4px 11px;
      border-radius: 2px; margin-right: 6px;
    }
    .tag-r { background: rgba(255,26,46,0.12); color: var(--red); border: 1px solid rgba(255,26,46,0.28); }
    .tag-g { background: rgba(0,255,136,0.09); color: var(--green); border: 1px solid rgba(0,255,136,0.28); }
    .tag-a { background: rgba(255,170,0,0.10); color: var(--amber); border: 1px solid rgba(255,170,0,0.28); }

    /* ══════════════════
       SCANNING
    ══════════════════ */
    .scan-wrap { text-align:center; padding: 28px 0; }
    .radar-ring {
      width: 96px; height: 96px; border-radius: 50%;
      border: 2px solid var(--red);
      margin: 0 auto 24px; position: relative;
      box-shadow: 0 0 26px var(--red-glow), inset 0 0 20px rgba(255,26,46,0.08);
      animation: spin 1.4s linear infinite;
    }
    .radar-ring::before {
      content:''; position:absolute; top:0; left:50%; width:50%; height:50%;
      background: conic-gradient(from 0deg, transparent 55%, rgba(255,26,46,0.55));
      transform-origin: bottom left;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* scan headline — italic */
    .scanning-label {
      font-family: var(--font-head); font-style: italic;
      font-size: 16px; color: var(--amber); letter-spacing: 3px;
      animation: flick 0.75s ease-in-out infinite;
    }
    @keyframes flick { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .scan-steps { margin-top: 18px; }
    .scan-step {
      font-family: var(--font-mono); font-size: 13px; color: var(--muted);
      letter-spacing: 1px; margin: 8px 0; transition: color 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .scan-step.active { color: var(--amber); }
    .scan-step.done   { color: var(--green); }
    .tick { font-size:15px; }

    /* ══════════════════
       RESULT — EMERGENCY
    ══════════════════ */
    .res-emergency {
      border: 1px solid var(--red); background: rgba(255,26,46,0.04); border-radius: 4px;
      padding: 30px; animation: empulse 1.6s ease-in-out infinite;
    }
    @keyframes empulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,26,46,0)} 50%{box-shadow:0 0 0 10px rgba(255,26,46,0.09)} }

    .em-head { display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }

    .em-badge {
      background: var(--red); color:#fff;
      font-family: var(--font-head); font-style: italic;
      font-size: 12px; letter-spacing: 3px; padding: 6px 16px;
      clip-path: polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
      animation: badgeblink 0.75s ease-in-out infinite;
    }
    @keyframes badgeblink { 0%,100%{opacity:1} 50%{opacity:0.65} }

    /* emergency headline — italic */
    .em-title {
      font-family: var(--font-head); font-style: italic;
      font-size: 20px; color: var(--red); text-shadow: 0 0 20px var(--red-glow);
    }
    .divider { height:1px; background: var(--border); margin:20px 0; }

    /* password */
    .pw-box {
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,170,0,0.35);
      border-radius: 3px; padding: 22px; margin: 20px 0;
    }
    .pw-lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 3.5px; margin-bottom: 12px; }
    .pw-code {
      font-family: var(--font-head); font-style: italic;
      font-size: 48px; font-weight:900; color: var(--amber);
      letter-spacing: 14px; text-shadow: 0 0 26px rgba(255,170,0,0.5);
    }
    .pw-hint { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* hospital */
    .hosp-box {
      background: rgba(0,255,136,0.04); border: 1px solid rgba(0,255,136,0.28);
      border-radius: 3px; padding: 20px; margin: 16px 0;
    }
    .hosp-lbl { font-family: var(--font-mono); font-size: 11px; color: var(--green); letter-spacing: 3px; margin-bottom: 12px; }

    /* hospital name — italic headline */
    .hosp-name {
      font-family: var(--font-head); font-style: italic;
      font-size: 22px; color: #fff; margin-bottom: 8px; letter-spacing: 2px;
    }
    .hosp-num {
      font-family: var(--font-mono); font-size: 26px; color: var(--green);
      text-shadow: 0 0 12px rgba(0,255,136,0.4);
    }
    .hosp-num a { color:inherit; text-decoration:none; }
    .hosp-num a:hover { text-decoration:underline; }
    .sent { font-family: var(--font-mono); font-size:13px; color:var(--green); margin-top:10px; }
    .sent::before { content:'✓  '; }
    .gps-note { font-family: var(--font-mono); font-size:11px; color:var(--muted); margin-top:8px; }

    /* log */
    .log {
      background: rgba(0,0,0,0.35); border-left: 2px solid var(--red);
      border-radius: 3px; padding: 16px; margin-top: 18px;
      font-family: var(--font-mono); font-size: 13px;
      color: var(--muted); line-height: 1.9;
    }
    .log-title {
      font-family: var(--font-head); font-style: italic;
      color: var(--red); font-size: 11px; letter-spacing: 2.5px; margin-bottom: 7px;
    }

    /* ══════════════════
       RESULT — SAFE
    ══════════════════ */
    .res-safe {
      border:1px solid rgba(0,255,136,0.28); background:rgba(0,255,136,0.03);
      border-radius:4px; padding:32px; text-align:center;
    }
    .safe-icon { font-size:52px; margin-bottom:16px; }

    /* safe headline — italic */
    .safe-title {
      font-family: var(--font-head); font-style: italic;
      font-size: 20px; color: var(--green); letter-spacing: 4px; margin-bottom: 12px;
    }
    .safe-desc { font-family: var(--font-mono); font-size: 13px; color: var(--muted); line-height: 1.85; }

    /* ══════════════════
       FOOTER
    ══════════════════ */
    .footer {
      text-align:center; padding:30px; border-top:1px solid var(--border);
      font-family: var(--font-mono); font-size:12px; color:var(--muted); letter-spacing:2.5px;
    }

    /* ══════════════════
       RESPONSIVE
    ══════════════════ */
    @media(max-width:580px){
      .header { padding:14px 18px; }
      .gps-grid { grid-template-columns:1fr; }
      .logo-title { font-size:26px; }
      .pw-code { font-size:32px; letter-spacing:8px; }
      .steps-nav { padding:22px 10px 0; }
      .step-line { min-width:22px; }
      .btn-yes, .btn-no { font-size:11px; padding:10px 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useRef } = React;

  function genCode() {
    return Math.floor(100000 + Math.random() * 900000).toString();
  }

  const SCAN_STEPS = [
    "Verifying GPS coordinates...",
    "Loading image data...",
    "Detecting objects and scene...",
    "Assessing injury severity...",
    "Cross-referencing emergency patterns...",
    "Generating response protocol...",
  ];

  function App() {
    const [gps,        setGps]      = useState(null);
    const [gpsErr,     setGpsErr]   = useState("");
    const [gpsLoading, setGpsLoad]  = useState(false);
    const [image,      setImage]    = useState(null);
    const [drag,       setDrag]     = useState(false);
    const [userFlag,   setUserFlag] = useState(null);
    const [scanning,   setScanning] = useState(false);
    const [scanIdx,    setScanIdx]  = useState(0);
    const [result,     setResult]   = useState(null);
    const [lockerCode]              = useState(genCode);
    const fileRef = useRef(null);

    const getGPS = () => {
      setGpsLoad(true); setGpsErr("");
      if (!navigator.geolocation) {
        setGpsErr("Geolocation not supported.");
        setGpsLoad(false); return;
      }
      navigator.geolocation.getCurrentPosition(
        p => {
          setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy });
          setGpsLoad(false);
        },
        () => {
          setGpsErr("GPS access denied — please allow location access in browser.");
          setGpsLoad(false);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    };

    const loadFile = f => {
      if (!f || !f.type.startsWith("image/")) return;
      setImage({ file: f, url: URL.createObjectURL(f) });
      setResult(null); setUserFlag(null);
    };
    const onFileChange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
    const onDrop = e => { e.preventDefault(); setDrag(false); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };

    const runScan = () => {
      setScanning(true); setScanIdx(0); setResult(null);
      let idx = 0;
      const iv = setInterval(() => {
        idx++;
        setScanIdx(idx);
        if (idx >= SCAN_STEPS.length) {
          clearInterval(iv);
          setTimeout(() => {
            setResult({ emergency: userFlag === true });
            setScanning(false);
          }, 700);
        }
      }, 550);
    };

    const step1Done  = !!gps;
    const step2Done  = !!image;
    const activeStep = !step1Done ? 1 : !step2Done ? 2 : 3;

    const reset     = () => { setImage(null); setResult(null); setUserFlag(null); setScanning(false); setScanIdx(0); if (fileRef.current) fileRef.current.value = ""; };
    const fullReset = () => { reset(); setGps(null); setGpsErr(""); };

    return (
      <>
        {/* ── HEADER ── */}
        <header className="header">
          <div className="logo">
            <div className="logo-hex">🔺</div>
            <div>
              <div className="logo-title">SHEFA</div>
              <div className="logo-sub">SMART HEALTH EMERGENCY FIRST-AID ALERT</div>
            </div>
          </div>
          <div className="online"><div className="dot" />SYSTEM ONLINE</div>
        </header>

        {/* ── STEPS NAV ── */}
        <div className="steps-nav">
          {[["01","GPS LOCK"],["02","PHOTO"],["03","DETECT"]].map(([n, lbl], i) => {
            const num    = i + 1;
            const isDone = (num===1&&step1Done)||(num===2&&step2Done)||(num===3&&!!result);
            const isAct  = num === activeStep && !isDone;
            return (
              <React.Fragment key={n}>
                {i > 0 && (
                  <div className={`step-line${
                    (num===2&&step1Done)||(num===3&&step2Done) ? " done" : ""
                  }`} />
                )}
                <div className="step-node">
                  <div className={`step-circle${isDone?" done":isAct?" active":""}`}>
                    {isDone ? "✓" : n}
                  </div>
                  <div className={`step-label${isDone?" done":isAct?" active":""}`}>{lbl}</div>
                </div>
              </React.Fragment>
            );
          })}
        </div>

        <main className="main">
          <div className="warn">
            ⚠ FOR GENUINE EMERGENCIES ONLY — GPS is mandatory. First-aid locker code only issued when a serious emergency is confirmed.
          </div>

          {/* ── STEP 1: GPS ── */}
          <div className="card">
            <div className="card-head">01 — GPS Location Acquisition</div>
            {!gps ? (
              <>
                <p className="desc-txt">
                  Your GPS coordinates are required to locate the nearest first-aid locker and hospital. Click below to share your location.
                </p>
                <button className="btn-primary" onClick={getGPS} disabled={gpsLoading}>
                  {gpsLoading ? "▶ ACQUIRING GPS…" : "▶ ENABLE GPS LOCATION"}
                </button>
                {gpsErr && (
                  <p style={{fontFamily:"var(--font-mono)",fontSize:13,color:"var(--red)",marginTop:13}}>
                    ✖ {gpsErr}
                  </p>
                )}
              </>
            ) : (
              <>
                <div className="gps-grid">
                  <div className="gps-field">
                    <div className="gps-lbl">LATITUDE</div>
                    <div className="gps-val">{gps.lat.toFixed(6)}°</div>
                  </div>
                  <div className="gps-field">
                    <div className="gps-lbl">LONGITUDE</div>
                    <div className="gps-val">{gps.lon.toFixed(6)}°</div>
                  </div>
                </div>
                <div className="gps-field" style={{marginBottom:14}}>
                  <div className="gps-lbl">ACCURACY</div>
                  <div className="gps-val">± {Math.round(gps.acc)} m</div>
                </div>
                <span className="tag tag-g">✓ GPS LOCKED</span>
                <button className="btn-ghost" style={{marginLeft:10,marginTop:0,padding:"6px 16px"}} onClick={fullReset}>
                  × RESET
                </button>
              </>
            )}
          </div>

          {/* ── STEP 2: PHOTO ── */}
          <div className="card">
            <div className="card-head">02 — Upload Emergency Scene Photo</div>
            {!image ? (
              <div
                className={`upload-zone${drag ? " over" : ""}`}
                onDragOver={e => { e.preventDefault(); setDrag(true); }}
                onDragLeave={() => setDrag(false)}
                onDrop={onDrop}
                onClick={() => fileRef.current && fileRef.current.click()}
              >
                <input ref={fileRef} type="file" accept="image/*" onChange={onFileChange} style={{display:"none"}} />
                <div className="upload-icon">📷</div>
                <div className="upload-text">DROP EMERGENCY PHOTO OR CLICK TO UPLOAD</div>
                <div className="upload-hint">JPG · PNG · WEBP — Max 10 MB</div>
              </div>
            ) : (
              <>
                <img src={image.url} alt="Scene" className="preview" />
                <div style={{marginTop:14}}>
                  <span className="tag tag-g">✓ PHOTO LOADED</span>
                  <span className="tag tag-r">{image.file.name}</span>
                </div>
                {!scanning && !result && (
                  <button className="btn-ghost" onClick={reset}>× REMOVE PHOTO</button>
                )}
              </>
            )}
          </div>

          {/* ── STEP 3: DETECT ── */}
          {image && (
            <div className="card">
              <div className="card-head">03 — Emergency Detection</div>

              {!scanning && !result && (
                <>
                  <p className="desc-txt">
                    Is there a visible emergency in the photo? (accident, injury, crash, fire)
                  </p>
                  <div style={{display:"flex",gap:14,marginBottom:24,flexWrap:"wrap"}}>
                    <button
                      className={`btn-yes${userFlag === true ? " sel" : ""}`}
                      onClick={() => setUserFlag(true)}
                    >
                      ✔ YES — EMERGENCY
                    </button>
                    <button
                      className={`btn-no${userFlag === false ? " sel" : ""}`}
                      onClick={() => setUserFlag(false)}
                    >
                      ✘ NO — NORMAL
                    </button>
                  </div>
                  {userFlag !== null && (
                    <button className="btn-big" onClick={runScan}>
                      <span className="sweep" />
                      ⚡ RUN EMERGENCY SCAN
                    </button>
                  )}
                </>
              )}

              {/* Scanning animation */}
              {scanning && (
                <div className="scan-wrap">
                  <div className="radar-ring" />
                  <div className="scanning-label">SCANNING EMERGENCY SCENE…</div>
                  <div className="scan-steps">
                    {SCAN_STEPS.map((s, i) => (
                      <div key={i} className={`scan-step${i===scanIdx?" active":i<scanIdx?" done":""}`}>
                        {i < scanIdx && <span className="tick">✓</span>}
                        {i === scanIdx && <span className="tick">▶</span>}
                        {i > scanIdx && <span className="tick" style={{opacity:0.25}}>○</span>}
                        {s}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* RESULT: EMERGENCY */}
              {result && result.emergency && (
                <div className="res-emergency">
                  <div className="em-head">
                    <div className="em-badge">🚨 EMERGENCY</div>
                    <div className="em-title">ACCIDENT / EMERGENCY DETECTED</div>
                  </div>
                  <div>
                    <span className="tag tag-r">SEVERITY: CRITICAL</span>
                    <span className="tag tag-a">RESPONSE: ACTIVE</span>
                  </div>
                  <div className="divider" />

                  <div className="pw-box">
                    <div className="pw-lbl">🔐 NEAREST FIRST-AID LOCKER — ACCESS CODE</div>
                    <div className="pw-code">{lockerCode}</div>
                    <div className="pw-hint">Use this code at the nearest emergency first-aid locker. Valid for 30 minutes.</div>
                  </div>

                  <div className="hosp-box">
                    <div className="hosp-lbl">🏥 NEAREST HOSPITAL — ALERT DISPATCHED</div>
                    <div className="hosp-name">BAPUJI HOSPITAL</div>
                    <div className="hosp-num"><a href="tel:9900583238">📞 9900583238</a></div>
                    <div className="sent">Emergency alert sent to Bapuji Hospital</div>
                    <div className="gps-note">
                      GPS: {gps.lat.toFixed(5)}, {gps.lon.toFixed(5)} — Ambulance dispatched to accident site
                    </div>
                  </div>

                  <div className="log">
                    <div className="log-title">AI ANALYSIS LOG</div>
                    Emergency scene confirmed at GPS ({gps.lat.toFixed(5)}, {gps.lon.toFixed(5)}).
                    Serious condition detected. First-aid locker unlocked. Alert dispatched to Bapuji Hospital (9900583238).
                    Ambulance requested. Please administer first-aid using the locker code above until help arrives.
                  </div>

                  <button className="btn-ghost" onClick={reset}>← NEW SCAN</button>
                </div>
              )}

              {/* RESULT: SAFE */}
              {result && !result.emergency && (
                <div className="res-safe">
                  <div className="safe-icon">✅</div>
                  <div className="safe-title">NO EMERGENCY DETECTED</div>
                  <p className="safe-desc">
                    The uploaded photo does not indicate a serious emergency or accident.<br />
                    First-aid locker access code has NOT been issued.<br />
                    No hospital alert has been sent.<br /><br />
                    If you believe this is an error, please call emergency services directly.
                  </p>
                  <button className="btn-ghost" style={{marginTop:22}} onClick={reset}>← TRY ANOTHER PHOTO</button>
                </div>
              )}
            </div>
          )}
        </main>

        <footer className="footer">
          SHEFA — SMART HEALTH EMERGENCY FIRST-AID ALERT &nbsp;|&nbsp; PARTNER: BAPUJI HOSPITAL &nbsp;|&nbsp; ☎ 9900583238
        </footer>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
